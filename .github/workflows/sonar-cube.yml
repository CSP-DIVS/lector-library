name: Standalone SonarQube Analysis

on:
  push:
    branches:
      - main # Or your default branch
  pull_request:
    branches:
      - main # Or your default branch
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This is a key step for SonarQube's pull request analysis
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Match the .NET version of your project

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          # This token is used to authenticate with SonarQube
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # This is required for SonarQube to decorate your pull requests
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Sets the base directory for the analysis to your 'backend' folder
          projectBaseDir: backend
          # Arguments to pass to the SonarScanner
          args: >
            /k:"${{ secrets.SONAR_PROJECT_KEY }}"
            /o:"${{ secrets.SONAR_ORGANIZATION_KEY }}"
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
            /d:sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml