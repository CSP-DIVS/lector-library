name: Lint Frontend

on:
  pull_request:
    paths:
      - 'frontend/csp-web/**'

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend/csp-web

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend/csp-web
