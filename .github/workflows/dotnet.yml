name: Backend CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      
      - name: Restore dependencies
        run: dotnet restore backend/Csp.Api
      
      - name: Build
        run: dotnet build --configuration Release --no-restore backend/Csp.Api
      
      - name: Run Unit Tests
        run: dotnet test backend/Csp.Unit.Tests/Csp.Unit.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=unit-tests.trx"
        continue-on-error: false
      
      - name: Run Integration Tests
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet test backend/Csp.Integration.Tests/Csp.Integration.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration-tests.trx"
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/**/TestResults/**/*.trx
      - name: Jira Login
        if: always()
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Create Jira Issue on Failure
        if: failure()
        uses: atlassian/gajira-create@v3
        with:
          project: LMS
          issuetype: Bug
          summary: "CI/CD pipeline failed for ${{ github.repository }} on ${{ github.ref }}"
          description: |
            The pipeline failed at ${{ github.workflow }}.
            See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
